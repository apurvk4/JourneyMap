<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Grid lines -->
  <path d="M12 24 H52 M12 40 H52 M24 12 V52 M40 12 V52" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- Route Path -->
  <path d="M16 48 C 24 48, 22 34, 32 34 C 40 34, 42 26, 46 22" 
        stroke="url(#pathGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Start waypoint dot -->
  <circle cx="16" cy="48" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

  <!-- Intermediate waypoint dot -->
  <circle cx="32" cy="34" r="2.5" fill="#818cf8" stroke="#ffffff" stroke-width="1.2" />

  <!-- Main Destination Pin -->
  <g transform="translate(46, 22)">
    <path d="M 0 0 C -4.5 -4 -7 -8 -7 -12 C -7 -16.5 -3.8 -19.5 0 -19.5 C 3.8 -19.5 7 -16.5 7 -12 C 7 -8 4.5 -4 0 0 Z" fill="url(#pinGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="-12" r="2.5" fill="#ffffff" />
  </g>
</svg>
