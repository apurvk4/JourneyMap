name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - name: Build Project
        run: npm run build
        env:
          GH_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Build Project
        run: npm run build
        env:
          GH_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Playwright - Chromium
        run: npm run test:e2e
      - name: Playwright - Mobile
        run: npx playwright test --project=mobile
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: production-build
          path: ./site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, e2e]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Fetch Vercel Production Domain
        run: |
          if [[ "${VERCEL_ORG_ID}" == team_* ]]; then
            TEAM_PARAM="?teamId=${VERCEL_ORG_ID}"
          else
            TEAM_PARAM=""
          fi
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains$TEAM_PARAM")
          DOMAIN=$(echo "$RESPONSE" | jq -r '.domains | map(select(.redirect == null)) | .[0].name // empty')
          if [ -z "$DOMAIN" ]; then
             DOMAIN=$(echo "$RESPONSE" | jq -r '.domains[0].name // empty')
          fi
          if [ -n "$DOMAIN" ]; then
            echo "Fetched Vercel production domain: $DOMAIN"
            echo "VERCEL_SITE_URL=https://$DOMAIN" >> $GITHUB_ENV
          else
            echo "Could not fetch domain. Falling back to default."
          fi
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
