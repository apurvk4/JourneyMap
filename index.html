<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JourneyMap — Google Timeline Visualizer</title>
    <meta name="description" content="Visualize, replay, and explore your Google Maps Timeline history interactively and privately in your browser." />
    <meta name="theme-color" content="#0f172a" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JourneyMap" />
    <meta property="og:title" content="JourneyMap — Google Timeline Visualizer" />
    <meta property="og:description" content="Visualize, replay, and explore your Google Maps Timeline history interactively and privately in your browser." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JourneyMap — Google Timeline Visualizer preview" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JourneyMap — Google Timeline Visualizer" />
    <meta property="twitter:title" content="JourneyMap — Google Timeline Visualizer" />
    <meta name="twitter:description" content="Visualize, replay, and explore your Google Maps Timeline history interactively and privately in your browser." />
    <meta property="twitter:description" content="Visualize, replay, and explore your Google Maps Timeline history interactively and privately in your browser." />
    <meta name="twitter:image" content="%OG_IMAGE_URL%" />
    <meta property="twitter:image" content="%OG_IMAGE_URL%" />

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com; connect-src 'self' https://*.basemaps.cartocdn.com https://basemaps.cartocdn.com; worker-src 'self' blob:; font-src 'self'">
    <meta name="referrer" content="no-referrer">
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
